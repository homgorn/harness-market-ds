name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # The derived catalog that the build imports
      # (data/catalog.ssr.json, buckets.json, ranks.json, related.json) is
      # committed to the repository; if it is missing, regenerate from the CDN.
      - name: Prepare derived catalog (sync if missing)
        run: |
          if [ ! -f data/catalog.ssr.json ]; then
            echo 'Derived catalog missing; running pnpm run sync'
            pnpm run sync
          else
            echo 'Derived catalog present; skipping sync'
          fi
      - run: pnpm run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=harness-market-ds
